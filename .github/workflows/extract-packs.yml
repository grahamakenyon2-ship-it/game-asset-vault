name: Extract Asset Packs

# workflow_dispatch = manual button. The push triggers are safe from loops:
# the bot's own commits only touch extracted/ (and never re-fire), and the
# packs/ trigger self-terminates (next run finds nothing new and exits 0).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packs/**'
      - '.github/workflows/extract-packs.yml'

concurrency:
  group: extract-packs
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # NOTE: p7zip-rar was REMOVED in Ubuntu 24.04 (current ubuntu-latest).
      # RAR (incl. RAR5) is handled by bsdtar (libarchive) with unar fallback.
      - name: Install extractors
        run: sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full libarchive-tools unar

      - name: Tidy stray archives into packs/
        run: |
          find . -maxdepth 1 -type f \( -name '*.zip' -o -name '*.rar' \) \
            -exec mv {} packs/ \; || true

      - name: Extract every pack into extracted/<pack-name>/
        run: |
          mkdir -p extracted
          shopt -s nullglob
          for a in packs/*.zip packs/*.rar; do
            name=$(basename "$a"); name="${name%.*}"
            mkdir -p "extracted/$name"
            echo "::group::Extracting $name"
            case "$a" in
              *.zip)
                7z x -y -o"extracted/$name" "$a" > /dev/null \
                  || bsdtar -xf "$a" -C "extracted/$name" ;;
              *.rar)
                bsdtar -xf "$a" -C "extracted/$name" \
                  || unar -q -f -D -o "extracted/$name" "$a" ;;
            esac
            echo "OK: $name"
            echo "::endgroup::"
          done

      - name: Strip OS junk
        run: |
          find extracted -type d -name '__MACOSX' -exec rm -rf {} + 2>/dev/null || true
          find extracted -type f \( -name '.DS_Store' -o -name 'Thumbs.db' -o -name 'desktop.ini' \) -delete || true

      - name: Commit and push (skip if nothing changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new to extract."
            exit 0
          fi
          git commit -m "extract: unpack all packs into extracted/ (auto)"
          git push
